<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">Timeline</a>
        <a href="quiz.html">Quiz</a>
        <a href="chronology.html">Chronology</a>
    </nav>

    <header>
        <h1>Chronology</h1>
    </header>

    <div class="container">
        <div id="list"></div>
        <button onclick="check()">Check</button>
        <button onclick="shuffle()">Shuffle</button>
    </div>

    <script src="data.js"></script>
    <script>
        let set = [];

        function shuffle() {
            set = [...EVENTS].sort(() => Math.random() - 0.5).slice(0, 6);
            render();
        }

        function render() {
            document.getElementById("list").innerHTML =
                set.map(e => `
      <div class="list-item" data-year="${e.year}" draggable="true">
        ${e.title}
      </div>
    `).join("");

            enableDrag();
        }

        function enableDrag() {
            let dragged;
            document.querySelectorAll(".list-item").forEach(el => {
                el.ondragstart = () => dragged = el;
                el.ondragover = e => e.preventDefault();
                el.ondrop = () => el.parentNode.insertBefore(dragged, el);
            });
        }

        function check() {
            let arr = [...document.querySelectorAll(".list-item")]
                .map(x => +x.dataset.year);

            let sorted = [...arr].sort((a, b) => a - b);

            alert(JSON.stringify(arr) === JSON.stringify(sorted)
                ? "Correct" : "Wrong order");
        }

        shuffle();
    </script>

</body>

</html>

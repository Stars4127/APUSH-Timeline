<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APUSH Timeline — Key Periods & Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1eb;
    --surface: #fdfaf6;
    --border: rgba(60,50,30,0.15);
    --border-strong: rgba(60,50,30,0.3);
    --text: #1a1510;
    --text-2: #6b5e4a;
    --text-3: #9e8e78;
    --accent: #c04a1a;
    --accent-light: #f0e0d6;
    --gold: #a07830;
    --gold-light: #f5edd8;
    --spine: rgba(60,50,30,0.2);

    --p1: #6b5bb8;
    --p2: #1d8a68;
    --p3: #c04a1a;
    --p4: #2676c0;
    --p5: #b84068;
    --p6: #4a8a18;
    --p7: #a06018;
    --p8: #4a38a0;
    --p9: #2a6828;

    --tag-politics-bg: #e0eaf8; --tag-politics-tx: #1a4a8a;
    --tag-economy-bg: #ddf0dd; --tag-economy-tx: #1a5a1a;
    --tag-society-bg: #ebe8f8; --tag-society-tx: #3a2888;
    --tag-conflict-bg: #f8e0e0; --tag-conflict-tx: #8a1a1a;
    --tag-expansion-bg: #f5ead8; --tag-expansion-tx: #7a4a10;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    background: var(--text);
    color: var(--bg);
    padding: 3.5rem 2rem 3rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.04) 79px, rgba(255,255,255,0.04) 80px);
    pointer-events: none;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--gold), var(--p4), var(--p2));
  }
  .header-inner { max-width: 960px; margin: 0 auto; position: relative; }
  .header-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: rgba(245,241,235,0.5);
    margin-bottom: .75rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--bg);
    margin-bottom: .6rem;
    letter-spacing: -.01em;
  }
  .header-sub {
    font-size: 14px;
    color: rgba(245,241,235,0.6);
    max-width: 520px;
    line-height: 1.6;
  }
  .period-pills-header {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 1.75rem;
  }
  .period-pill-h {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid rgba(245,241,235,0.2);
    color: rgba(245,241,235,0.55);
    cursor: pointer;
    transition: all .18s;
  }
  .period-pill-h:hover, .period-pill-h.on {
    background: rgba(245,241,235,0.12);
    border-color: rgba(245,241,235,0.4);
    color: rgba(245,241,235,0.9);
  }
  .period-pill-h.on { border-color: var(--accent); color: var(--accent); }

  /* ── Controls ── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    padding: .75rem 2rem;
    display: flex;
    gap: .75rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    flex: 1;
    min-width: 180px;
    max-width: 280px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    opacity: .4;
  }
  .search-input {
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 10px 7px 32px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:focus { border-color: var(--accent); }

  .divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

  .filter-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-3);
    flex-shrink: 0;
  }
  .tag-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .05em;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    transition: all .15s;
  }
  .tag-btn:hover { background: var(--bg); }
  .tag-btn[data-t="politics"].on  { background: var(--tag-politics-bg); color: var(--tag-politics-tx); border-color: transparent; }
  .tag-btn[data-t="economy"].on   { background: var(--tag-economy-bg); color: var(--tag-economy-tx); border-color: transparent; }
  .tag-btn[data-t="society"].on   { background: var(--tag-society-bg); color: var(--tag-society-tx); border-color: transparent; }
  .tag-btn[data-t="conflict"].on  { background: var(--tag-conflict-bg); color: var(--tag-conflict-tx); border-color: transparent; }
  .tag-btn[data-t="expansion"].on { background: var(--tag-expansion-bg); color: var(--tag-expansion-tx); border-color: transparent; }
  .tag-btn[data-t="all"].on       { background: var(--text); color: var(--bg); border-color: transparent; }

  .count-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    margin-left: auto;
    flex-shrink: 0;
  }

  /* ── Main layout ── */
  main { max-width: 960px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

  /* ── Timeline ── */
  .timeline { position: relative; padding-left: 28px; }
  .tl-spine {
    position: absolute;
    left: 9px; top: 12px; bottom: 20px;
    width: 1px;
    background: var(--spine);
  }

  .period-block {
    margin-bottom: 2.5rem;
    animation: fadeIn .3s ease both;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .period-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: .9rem;
    position: relative;
  }
  .p-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: -28px;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--spine);
    position: relative;
    z-index: 2;
    top: 3px;
  }
  .p-label {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .p-dates {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
  }
  .p-theme {
    font-size: 12px;
    color: var(--text-3);
    font-style: italic;
    margin-left: 2px;
  }

  .ev-grid {
    padding-left: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .ev-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    position: relative;
  }
  .ev-card:hover {
    border-color: var(--border-strong);
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    transform: translateX(2px);
  }
  .ev-year {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-3);
    min-width: 64px;
    padding-top: 2px;
    flex-shrink: 0;
  }
  .ev-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    line-height: 1.4;
  }
  .ev-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: .05em;
    padding: 3px 7px;
    border-radius: 20px;
    flex-shrink: 0;
    font-weight: 500;
    margin-top: 1px;
    text-transform: uppercase;
  }

  /* ── Modal ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,21,16,.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    max-width: 480px;
    width: 100%;
    position: relative;
    overflow: hidden;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

  .modal-stripe { height: 4px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .modal-body { padding: 1.5rem; }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-2);
    line-height: 1;
    transition: border-color .15s;
  }
  .modal-close:hover { border-color: var(--border-strong); }
  .m-yr {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    margin-bottom: 5px;
  }
  .m-title {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .m-sig {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.7;
    margin-bottom: 14px;
  }
  .m-conn {
    background: var(--gold-light);
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .m-conn strong { color: var(--gold); font-weight: 500; }
  .m-footer { display: flex; gap: 8px; }
  .m-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    transition: all .15s;
  }
  .m-btn-primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .m-btn-primary:hover { background: var(--accent); border-color: var(--accent); }
  .m-btn-secondary { background: transparent; color: var(--text-2); }
  .m-btn-secondary:hover { background: var(--bg); }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-3);
  }
  .empty p { font-size: 14px; margin-top: .5rem; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: .08em;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 2rem 1.25rem; }
    .controls { padding: .65rem 1.25rem; }
    main { padding: 1.75rem 1.25rem 3rem; }
    h1 { font-size: 1.8rem; }
    .search-wrap { max-width: none; flex: 1 1 100%; }
    .divider { display: none; }
    .count-badge { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-eyebrow">AP United States History</div>
    <h1>The American Timeline</h1>
    <p class="header-sub">All 9 APUSH periods with key events, significance, and exam connections. Click any event for details.</p>
    <div class="period-pills-header" id="period-pills"></div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input class="search-input" id="srch" type="text" placeholder="Search events…" oninput="render()">
  </div>
  <div class="divider"></div>
  <span class="filter-label">Theme</span>
  <button class="tag-btn on" data-t="all" onclick="setTag(this)">All</button>
  <button class="tag-btn" data-t="politics" onclick="setTag(this)">Politics</button>
  <button class="tag-btn" data-t="economy" onclick="setTag(this)">Economy</button>
  <button class="tag-btn" data-t="society" onclick="setTag(this)">Society</button>
  <button class="tag-btn" data-t="conflict" onclick="setTag(this)">Conflict</button>
  <button class="tag-btn" data-t="expansion" onclick="setTag(this)">Expansion</button>
  <span class="count-badge" id="count-badge"></span>
</div>

<main>
  <div class="timeline">
    <div class="tl-spine"></div>
    <div id="tl"></div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-stripe" id="m-stripe"></div>
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="m-yr" id="m-yr"></div>
      <div class="m-title" id="m-title"></div>
      <div class="m-sig" id="m-sig"></div>
      <div class="m-conn" id="m-conn"></div>
      <div class="m-footer">
        <button class="m-btn m-btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<footer>APUSH — 9 Periods · 50 Key Events · All Learning Objectives</footer>

<script>
var D=[
  {id:1,label:"Period 1",dates:"1491–1607",theme:"Contact & Colonization",color:"#6b5bb8",events:[
    {yr:"1491",name:"Pre-Columbian Americas",tag:"society",sig:"Diverse Native civilizations — Aztec, Inca, Mississippian, Pueblo — thrived with complex political, economic, and agricultural systems before European contact.",conn:"Sets the foundation for understanding native–European interaction throughout the colonial period. APUSH emphasizes the diversity and sophistication of these societies."},
    {yr:"1492",name:"Columbus reaches the Caribbean",tag:"expansion",sig:"Initiated sustained contact between Europe and the Americas, beginning colonization that reshaped both hemispheres and triggered the Columbian Exchange of crops, animals, and diseases.",conn:"Triggers European competition for American territory and centuries of cultural and biological exchange — a key APUSH theme of continuity and change over time."},
    {yr:"1519",name:"Cortés conquers the Aztec Empire",tag:"conflict",sig:"With a small force and indigenous allies, Cortés defeated the Aztecs — demonstrating how disease, diplomacy, and military technology enabled conquest.",conn:"Model for later European conquest patterns. APUSH asks you to analyze the roles of disease, political alliances, and technology in Spanish success."},
    {yr:"1565",name:"St. Augustine founded",tag:"expansion",sig:"Oldest continuously occupied European settlement in North America, founded by Spain as a military outpost in Florida.",conn:"Reflects Spanish imperial strategy along the Atlantic coast prior to English colonization — useful context for Period 2 comparisons of colonial motivations."}
  ]},
  {id:2,label:"Period 2",dates:"1607–1754",theme:"Colonization & Settlement",color:"#1d8a68",events:[
    {yr:"1607",name:"Jamestown founded",tag:"expansion",sig:"England's first permanent North American settlement, established by the Virginia Company for profit. Early years marked by starvation, disease, and conflict with the Powhatan Confederacy.",conn:"Begins English colonial presence. APUSH uses Jamestown to compare English, Spanish, and French colonial models and labor systems."},
    {yr:"1619",name:"First Africans arrive in Virginia",tag:"society",sig:"Arrival of approximately 20 enslaved Africans at Point Comfort began the African presence in English North America, laying groundwork for chattel slavery.",conn:"Critical APUSH origin point for race and slavery as central themes. Connect to Bacon's Rebellion and the hardening of racial slavery laws."},
    {yr:"1620",name:"Mayflower Compact",tag:"politics",sig:"Pilgrims created a self-governing covenant aboard the Mayflower, reflecting Protestant ideals of community and representative governance.",conn:"Early example of colonial self-government — APUSH traces this tradition through colonial assemblies to the Constitutional Convention."},
    {yr:"1676",name:"Bacon's Rebellion",tag:"conflict",sig:"Nathaniel Bacon led a multiracial coalition of poor farmers and servants against Virginia's colonial elite, challenging class and racial hierarchy.",conn:"A key APUSH turning point: accelerated the shift from indentured servitude to African chattel slavery as planters sought a more controllable labor force."},
    {yr:"1692",name:"Salem Witch Trials",tag:"society",sig:"Over 200 accused; 20 executed. Reflected social tensions, gender dynamics, and Puritan religious anxiety in Massachusetts.",conn:"APUSH uses Salem to illustrate social fractures in Puritan New England and limits of theocratic governance."}
  ]},
  {id:3,label:"Period 3",dates:"1754–1800",theme:"Revolution & Republic",color:"#c04a1a",events:[
    {yr:"1754",name:"French and Indian War",tag:"conflict",sig:"North American theater of the Seven Years' War; ultimately expelled France from North America and saddled Britain with enormous debt.",conn:"British war debt led to new colonial taxes — APUSH directly traces this to the Stamp Act, Sons of Liberty, and eventually independence."},
    {yr:"1776",name:"Declaration of Independence",tag:"politics",sig:"Jefferson articulated Enlightenment ideals of natural rights, popular sovereignty, and the social contract as justification for independence from Britain.",conn:"Foundational APUSH document. Know its Enlightenment influences (Locke), its contradictions regarding slavery, and its use by later reform movements."},
    {yr:"1781",name:"Battle of Yorktown",tag:"conflict",sig:"Cornwallis's surrender ended major Revolutionary War fighting, secured by French naval and military support.",conn:"Effectively ended the Revolutionary War — APUSH emphasizes France's critical role and the limits of British strategy."},
    {yr:"1787",name:"Constitutional Convention",tag:"politics",sig:"Delegates replaced the Articles of Confederation with a stronger federal framework — separation of powers, federalism, and checks and balances.",conn:"Core APUSH content. Know the major compromises (3/5, Great, Commerce/Slave Trade) and the Federalist vs. Anti-Federalist debates."},
    {yr:"1798",name:"Alien and Sedition Acts",tag:"politics",sig:"Federalist legislation targeted immigrants and government critics, provoking Virginia and Kentucky Resolutions asserting states' rights.",conn:"Early test of free speech and federal vs. state authority — APUSH connects this directly to nullification debates in the antebellum era."}
  ]},
  {id:4,label:"Period 4",dates:"1800–1848",theme:"Democracy & Expansion",color:"#2676c0",events:[

    {yr:"1820",name:"Missouri Compromise",tag:"politics",sig:"Admitted Missouri as a slave state and Maine free; drew the 36°30' line to regulate slavery's future expansion westward.",conn:"A key APUSH sectional compromise. APUSH LEQs often ask you to compare the Missouri, 1850, and Kansas-Nebraska compromises."},
    {yr:"1828",name:"Tariff of Abominations",tag:"economy",sig:"High protective tariff enraged Southern states, leading to South Carolina's Nullification Crisis and Calhoun's states' rights doctrine.",conn:"APUSH: prefigures the sectional conflict over federal power vs. state sovereignty. Jackson's firm response showed limits of nullification."},
    {yr:"1830",name:"Indian Removal Act",tag:"politics",sig:"Authorized forced removal of Native Americans from the Southeast, leading to the Trail of Tears (1838–39) and thousands of deaths.",conn:"APUSH: starkest example of racial dispossession in the antebellum era. Note that the Supreme Court ruled against removal, but Jackson defied it."},
    {yr:"1848",name:"Seneca Falls Convention",tag:"society",sig:"First women's rights convention in the U.S., producing the Declaration of Sentiments modeled on the Declaration of Independence.",conn:"Foundation of the women's suffrage movement — APUSH connects it to abolitionism and the reform culture of the Second Great Awakening."}
  ]},
  {id:5,label:"Period 5",dates:"1844–1877",theme:"Civil War & Reconstruction",color:"#b84068",events:[

    {yr:"1857",name:"Dred Scott decision",tag:"politics",sig:"Chief Justice Taney ruled African Americans were not citizens and Congress could not ban slavery in territories — invalidating the Missouri Compromise.",conn:"A critical APUSH case. Dred Scott radicalized both sections and made the election of 1860 — and thus secession — more likely."},
    {yr:"1861",name:"Civil War begins",tag:"conflict",sig:"Confederate attack on Fort Sumter launched four years of war. Over 620,000 soldiers died in a conflict over union, slavery, and the nature of American democracy.",conn:"Transformative APUSH conflict. Know the causes (slavery, sectionalism, election of 1860), major turning points, and the war's social impact."},
    {yr:"1863",name:"Emancipation Proclamation",tag:"politics",sig:"Lincoln declared enslaved people in Confederate states free, reframing the war as a fight against slavery and enabling Black men to enlist.",conn:"APUSH moral turning point. Note its limits (only Confederate states), military strategy, and path to the 13th Amendment."},
    {yr:"1865–1877",name:"Reconstruction",tag:"politics",sig:"Federal effort to reintegrate Southern states and define the rights of freed people. The 13th, 14th, and 15th Amendments transformed American citizenship.",conn:"Hugely important APUSH period. Know the competing visions (Lincoln, Radical Republicans, Johnson), the amendments, and causes of Reconstruction's collapse."}
  ]},
  {id:6,label:"Period 6",dates:"1865–1898",theme:"Gilded Age & Industrialization",color:"#4a8a18",events:[
    {yr:"1869",name:"Transcontinental Railroad completed",tag:"economy",sig:"Joined the nation coast-to-coast, accelerating western settlement, industrial growth, and the displacement of Native peoples from the Great Plains.",conn:"APUSH symbol of industrial capitalism's power and the federal government's role in economic development via land grants."},
    {yr:"1877",name:"End of Reconstruction / Railroad Strike",tag:"conflict",sig:"The Compromise of 1877 ended Reconstruction; the Railroad Strike of 1877 was America's first great labor uprising, suppressed by federal troops.",conn:"APUSH: marks the abandonment of Black civil rights and the rise of organized labor conflict — two parallel stories of the Gilded Age."},
    {yr:"1882",name:"Chinese Exclusion Act",tag:"politics",sig:"First federal law restricting immigration by nationality and class, reflecting nativist anxieties about race and labor competition.",conn:"APUSH precedent for immigration restriction — connects to the Immigration Acts of 1917 and 1924."},
    {yr:"1886",name:"American Federation of Labor founded",tag:"economy",sig:"Samuel Gompers organized skilled workers into craft unions advocating for wages, hours, and conditions.",conn:"APUSH: dominant labor organization through the Progressive Era. Know the AFL's 'bread and butter' approach vs. industrial unionism."},
    {yr:"1896",name:"Plessy v. Ferguson",tag:"politics",sig:"Supreme Court upheld 'separate but equal' doctrine, giving constitutional backing to Jim Crow segregation across the South.",conn:"Key APUSH case enshrining segregation for 58 years. Always pair with Brown v. Board (1954) on LEQs about civil rights change over time."}
  ]},
  {id:7,label:"Period 7",dates:"1890–1945",theme:"Progressive Era to WWII",color:"#a06018",events:[
    {yr:"1898",name:"Spanish-American War",tag:"conflict",sig:"Brief war gave the U.S. Cuba, Puerto Rico, Guam, and the Philippines — marking America's emergence as an imperial power.",conn:"APUSH: opens debates about imperialism, race, and American identity. Know the Anti-Imperialist League's arguments and debates over empire."},
    {yr:"1913",name:"16th & 17th Amendments",tag:"politics",sig:"Income tax and direct election of senators — landmark Progressive reforms shifting power from corporate interests and state legislatures.",conn:"APUSH: structural Progressive Era changes. Know the full reform agenda: 16th, 17th, 18th, 19th Amendments and the regulatory agencies."},
    {yr:"1917",name:"U.S. enters World War I",tag:"conflict",sig:"Wilson entered the war framing it as a fight for democracy; at home, the Espionage and Sedition Acts suppressed dissent.",conn:"APUSH: reshaped global order and disillusioned Americans. The Senate's rejection of the League connects to 1920s isolationism."},
    {yr:"1920",name:"19th Amendment",tag:"politics",sig:"Granted women the right to vote after decades of suffragist activism — the largest single expansion of the American electorate.",conn:"APUSH culmination of the suffrage movement. Note the movement's internal tensions around race and the connections to the Progressive Era."},
    {yr:"1929",name:"Great Depression begins",tag:"economy",sig:"Stock market crash triggered mass unemployment, bank failures, and economic devastation — 25% unemployment by 1933.",conn:"APUSH: transformed the citizen–government relationship. The Depression made the New Deal politically necessary and reshaped federalism."},
    {yr:"1941",name:"Pearl Harbor / U.S. enters WWII",tag:"conflict",sig:"Japan's attack brought the U.S. into WWII, mobilizing the entire economy. Also led to internment of 120,000 Japanese Americans.",conn:"APUSH: WWII ended the Depression, established American global hegemony, and set the stage for the Cold War. Know the home front impacts."}
  ]},
  {id:8,label:"Period 8",dates:"1945–1980",theme:"Cold War America",color:"#4a38a0",events:[
    {yr:"1947",name:"Truman Doctrine & Marshall Plan",tag:"politics",sig:"U.S. committed to containing communism globally and rebuilding Western Europe economically — defining Cold War strategy for four decades.",conn:"APUSH: established the containment policy that guided U.S. foreign policy. Know NSC-68 as the key document expanding this commitment."},
    {yr:"1954",name:"Brown v. Board of Education",tag:"politics",sig:"Supreme Court unanimously overturned Plessy v. Ferguson, ruling school segregation unconstitutional — energizing the civil rights movement.",conn:"APUSH landmark — always pair with Plessy on essays about change over time in civil rights. Know Chief Justice Warren's unanimous opinion."},
    {yr:"1955–1968",name:"Civil Rights Movement",tag:"society",sig:"From Montgomery Bus Boycott to the March on Washington, the movement secured the Civil Rights Act (1964) and Voting Rights Act (1965).",conn:"Highest-priority APUSH Period 8 content. Know the key organizations (NAACP, SNCC, SCLC), tactics, legislation, and internal debates."},
    {yr:"1964",name:"Civil Rights Act & Gulf of Tonkin",tag:"politics",sig:"Civil Rights Act banned discrimination; Gulf of Tonkin Resolution authorized Vietnam escalation — two pivotal events defining LBJ's presidency.",conn:"APUSH: together defined the Great Society and its undoing as Vietnam consumed political capital and triggered the credibility gap."},
    {yr:"1968",name:"Year of Crisis",tag:"conflict",sig:"MLK and RFK assassinated; the Tet Offensive shocked Americans; protests erupted at the Democratic National Convention; Nixon won the presidency.",conn:"APUSH turning point — 1968 marks the fracturing of the New Deal coalition and the beginning of the conservative realignment."},
    {yr:"1972–1974",name:"Watergate",tag:"politics",sig:"Nixon's cover-up of the Watergate break-in led to his resignation — the only presidential resignation in U.S. history.",conn:"APUSH: shattered public trust in government and fueled anti-government sentiment that helped elect Reagan in 1980."}
  ]},
  {id:9,label:"Period 9",dates:"1980–Present",theme:"Contemporary America",color:"#2a6828",events:[
    {yr:"1980",name:"Reagan Revolution",tag:"politics",sig:"Reagan's election signaled a conservative realignment — tax cuts, deregulation, and anti-communism replaced the New Deal liberal consensus.",conn:"APUSH: know Reaganomics (supply-side economics), the Religious Right's rise, and how Reagan's coalition reshaped both parties."},
    {yr:"1989–1991",name:"Cold War ends",tag:"politics",sig:"Fall of the Berlin Wall and dissolution of the Soviet Union ended the defining conflict of the postwar era.",conn:"APUSH: left the U.S. as the world's sole superpower — raises questions about the purposes of American foreign policy that persist today."},
    {yr:"1994",name:"NAFTA",tag:"economy",sig:"North American Free Trade Agreement created a free trade zone with Canada and Mexico, accelerating integration but contributing to manufacturing job losses.",conn:"APUSH: represents the Clinton-era embrace of globalization — fueled debates about trade, deindustrialization, and economic inequality."},
    {yr:"2001",name:"September 11 attacks",tag:"conflict",sig:"Al-Qaeda killed nearly 3,000 people and triggered the War on Terror, reshaping U.S. foreign policy, civil liberties, and national security.",conn:"Defining APUSH event of the contemporary era. Know the USA PATRIOT Act, Afghanistan, Iraq War, and debates over civil liberties vs. security."},
    {yr:"2008",name:"Financial Crisis & Obama election",tag:"economy",sig:"Worst economic crisis since the Depression coincided with the historic election of the first African American president.",conn:"APUSH: led to the Affordable Care Act and the Tea Party backlash — illustrates how economic crisis drives political realignment."}
  ]}
];

var TC={
  politics:  {bg:"var(--tag-politics-bg)", tx:"var(--tag-politics-tx)"},
  economy:   {bg:"var(--tag-economy-bg)",  tx:"var(--tag-economy-tx)"},
  society:   {bg:"var(--tag-society-bg)",  tx:"var(--tag-society-tx)"},
  conflict:  {bg:"var(--tag-conflict-bg)", tx:"var(--tag-conflict-tx)"},
  expansion: {bg:"var(--tag-expansion-bg)",tx:"var(--tag-expansion-tx)"}
};

var activeTag="all", activePid=null, curEv=null;

function buildPills(){
  var c=document.getElementById("period-pills");
  D.forEach(function(p){
    var b=document.createElement("span");
    b.className="period-pill-h"; b.textContent=p.label+" · "+p.dates; b.dataset.pid=p.id;
    b.onclick=function(){
      activePid=(activePid===p.id)?null:p.id;
      document.querySelectorAll(".period-pill-h").forEach(function(x){x.classList.toggle("on",+x.dataset.pid===activePid);});
      render();
    };
    c.appendChild(b);
  });
}

function render(){
  var tl=document.getElementById("tl"); tl.innerHTML="";
  var q=document.getElementById("srch").value.toLowerCase().trim();
  var total=0;
  D.forEach(function(p,pi){
    var evs=p.events.filter(function(e){
      return (activeTag==="all"||e.tag===activeTag)&&(activePid===null||activePid===p.id)&&(!q||e.name.toLowerCase().includes(q)||e.sig.toLowerCase().includes(q)||e.yr.includes(q));
    });
    if(!evs.length) return;
    total+=evs.length;
    var block=document.createElement("div");
    block.className="period-block";
    block.style.animationDelay=(pi*.04)+"s";

    var head=document.createElement("div"); head.className="period-header";
    head.innerHTML='<div class="p-dot" style="background:'+p.color+'"></div>'
      +'<span class="p-label">'+p.label+'</span>'
      +'<span class="p-dates">'+p.dates+'</span>'
      +'<span class="p-theme">— '+p.theme+'</span>';
    block.appendChild(head);

    var grid=document.createElement("div"); grid.className="ev-grid";
    evs.forEach(function(e){
      var tc=TC[e.tag]||{bg:"#eee",tx:"#555"};
      var card=document.createElement("div"); card.className="ev-card";
      card.innerHTML='<span class="ev-year">'+e.yr+'</span>'
        +'<span class="ev-name">'+e.name+'</span>'
        +'<span class="ev-tag" style="background:'+tc.bg+';color:'+tc.tx+'">'+e.tag+'</span>';
      card.onclick=function(){openModal(e,p.color);};
      grid.appendChild(card);
    });
    block.appendChild(grid);
    tl.appendChild(block);
  });

  if(!total){
    tl.innerHTML='<div class="empty"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#c8b89a" stroke-width="1.5"/><path d="M13 20h14M20 13v14" stroke="#c8b89a" stroke-width="1.5" stroke-linecap="round" opacity=".4"/></svg><p>No events match your filters.</p></div>';
  }
  document.getElementById("count-badge").textContent=total+" event"+(total===1?"":"s");
}

function setTag(el){
  activeTag=el.dataset.t;
  document.querySelectorAll(".tag-btn").forEach(function(x){x.classList.toggle("on",x.dataset.t===activeTag);});
  render();
}

function openModal(e,color){
  curEv=e;
  document.getElementById("m-stripe").style.background="linear-gradient(90deg,"+color+","+color+"88)";
  document.getElementById("m-yr").textContent=e.yr;
  document.getElementById("m-title").textContent=e.name;
  document.getElementById("m-sig").textContent=e.sig;
  document.getElementById("m-conn").innerHTML="<strong>APUSH connection →</strong> "+e.conn;
  document.getElementById("overlay").classList.add("open");
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); }

document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape") closeModal();
});

buildPills(); render();
</script>
</body>
</html>

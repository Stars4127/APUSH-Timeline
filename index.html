<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <a href="index.html">Timeline</a>
    <a href="quiz.html">Quiz</a>
    <a href="chronology.html">Chronology</a>
  </nav>

  <header>
    <h1>APUSH Timeline</h1>
  </header>

  <div class="container timeline" id="out"></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="m-title"></h3>
      <p id="m-desc"></p>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const out = document.getElementById("out");

    EVENTS.forEach(e => {
      const div = document.createElement("div");
      div.className = "card";
      div.dataset.p = e.p;

      div.innerHTML = `
    <div class="year">${e.year}</div>
    <div class="title">${e.title}</div>
    <div class="tag">period ${e.p}</div>
  `;

      div.onclick = () => {
        document.getElementById("m-title").innerText = e.title;
        document.getElementById("m-desc").innerText = e.desc;
        document.getElementById("overlay").classList.add("open");
      };

      out.appendChild(div);
    });

    function closeModal() {
      document.getElementById("overlay").classList.remove("open");
    }
  </script>

</body>

</html>
